name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check public repository files
        run: python scripts/check_public_files.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Source GUI smoke test
        run: python -m statin_nhi.smoke build/reports/source.json
      - name: Build Windows executable
        run: python -m PyInstaller --clean --noconfirm --distpath build/verification-dist --workpath build/verification-work Statin_NHI.spec
      - name: Frozen EXE GUI smoke test
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'build/reports/exe.json'
          $process = Start-Process -FilePath 'build/verification-dist/Statin_NHI.exe' -ArgumentList '--smoke-test', $report -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'EXE smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw "EXE exited with $($process.ExitCode)" }
          if (-not (Test-Path $report)) { throw 'EXE did not create smoke report' }
          if (-not (Get-Content $report -Raw | ConvertFrom-Json).ok) { throw 'EXE smoke report failed' }
      - name: Prepare release files
        shell: pwsh
        run: |
          $version = python -c "from statin_nhi import __version__; print(__version__)"
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") { throw 'Tag must match application version' }
          Copy-Item README.md build/verification-dist/README.md
          Copy-Item CHANGELOG.md build/verification-dist/CHANGELOG.md
          Copy-Item LICENSE build/verification-dist/LICENSE
          Copy-Item THIRD_PARTY_NOTICES.md build/verification-dist/THIRD_PARTY_NOTICES.md
          Copy-Item docs build/verification-dist/docs -Recurse
          Copy-Item examples build/verification-dist/examples -Recurse
          New-Item -ItemType Directory -Path build/verification-dist/Ref -Force | Out-Null
          git -c core.quotepath=false ls-files -- Ref | ForEach-Object { Copy-Item -LiteralPath $_ -Destination build/verification-dist/Ref }
          python scripts/collect_licenses.py build/verification-dist/THIRD_PARTY_LICENSES.txt
          if ($LASTEXITCODE -ne 0) { throw 'License collection failed' }
          $hash = (Get-FileHash build/verification-dist/Statin_NHI.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Statin_NHI.exe" | Out-File build/verification-dist/SHA256SUMS.txt -Encoding ascii
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Statin_NHI-Windows-${{ github.sha }}
          path: build/verification-dist/
          if-no-files-found: error
      - name: Upload GUI verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GUI-verification-${{ github.sha }}
          path: build/reports/
          if-no-files-found: warn
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Statin_NHI-Windows-${{ github.sha }}
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          (cd release && zip -r ../Statin_NHI-Windows.zip .)
          gh release create "$RELEASE_TAG" release/*.exe release/*.txt release/*.md release/LICENSE Statin_NHI-Windows.zip --verify-tag --title "Statin NHI $RELEASE_TAG" --notes '完整變更見附件 CHANGELOG.md。已通過測試、Windows 原始碼及 EXE GUI 冒煙驗證；仍請於實際院內 Windows 確認顯示與操作。請保留自己的 Statin_NHI_available.json，發布包不含院內設定。EXE 未簽章；附件 LICENSE、THIRD_PARTY_NOTICES.md 及 THIRD_PARTY_LICENSES.txt 列明授權。'
